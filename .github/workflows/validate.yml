name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
