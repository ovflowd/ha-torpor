version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # pytest-homeassistant pins one Home Assistant release, which pins everything else, so its
      # bumps arrive as one pull request with ruff and pytest-cov.
      dev:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
